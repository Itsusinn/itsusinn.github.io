name: CI and Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve physics-simulation source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/Itsusinn/physics-simulation/commits/main --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  physics-simulation:
    needs: source
    uses: Itsusinn/physics-simulation/.github/workflows/build.yml@main
    with:
      ref: ${{ needs.source.outputs.sha }}

  build:
    needs: [source, physics-simulation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: justfile
      - uses: extractions/setup-just@v4
      - name: Build the blog
        run: just build
      - name: Install the physics-simulation application
        uses: actions/download-artifact@v4
        with:
          name: physics-simulation-web
          path: site/apps/physics-simulation
      - name: Validate the complete website
        env:
          PHYSICS_SIMULATION_SHA: ${{ needs.source.outputs.sha }}
        run: uv run --no-project --python 3.13 scripts/check_site.py --require-physics-simulation "$PHYSICS_SIMULATION_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
